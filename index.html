<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Halo - Autenticación</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent: #e08a6b;
            --accent-hover: #cc785c;
            --text-main: #f0ebe2;
            --text-muted: #8a8578;
            --input-bg: #2a2723;
            --border: #3f3b34;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .auth-container {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 40px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: bold;
            color: var(--accent);
            margin-bottom: 8px;
        }

        .subtitle {
            text-align: center;
            font-size: 14px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--border);
        }

        .tab-btn {
            flex: 1;
            padding: 10px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 15px;
            cursor: pointer;
            border-bottom: 2px solid transparent;
        }

        .tab-btn.active {
            color: var(--accent);
            border-bottom-color: var(--accent);
            font-weight: bold;
        }

        .google-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text-main);
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
            transition: background-color 0.2s;
        }

        .google-btn:hover {
            background-color: #35312b;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            color: var(--text-muted);
            font-size: 12px;
            margin-bottom: 20px;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider span {
            padding: 0 10px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
            background-color: var(--input-bg);
            color: var(--text-main);
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
        }

        .submit-btn {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: var(--accent);
            color: #ffffff;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: var(--accent-hover);
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="logo">✦ Halo</div>
    <div class="subtitle">Inicia sesión o regístrate para continuar</div>

    <button class="google-btn" onclick="loginWithGoogle()">
        <svg width="18" height="18" viewBox="0 0 24 24">
            <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
            <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
            <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
            <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        Continuar con Google
    </button>

    <div class="divider"><span>o con correo</span></div>

    <div class="tabs">
        <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Iniciar Sesión</button>
        <button class="tab-btn" id="tab-register" onclick="switchTab('register')">Registrarse</button>
    </div>

    <form id="auth-form" onsubmit="handleSubmit(event)">
        <div class="form-group">
            <label>Correo Electrónico</label>
            <input type="email" id="email" required placeholder="tu@email.com">
        </div>
        <div class="form-group">
            <label>Contraseña</label>
            <input type="password" id="password" required placeholder="••••••••">
        </div>
        <button type="submit" class="submit-btn" id="btn-text">Iniciar Sesión</button>
    </form>
</div>

<script>
    let mode = 'login';
    const BACKEND_URL = "https://halo-backend-production-25af.up.railway.app";
    
    // Extrae la URL de callback enviada desde la app de escritorio
    const urlParams = new URLSearchParams(window.location.search);
    const redirectUri = urlParams.get('redirect_uri');

    function switchTab(newMode) {
        mode = newMode;
        document.getElementById('tab-login').classList.toggle('active', mode === 'login');
        document.getElementById('tab-register').classList.toggle('active', mode === 'register');
        document.getElementById('btn-text').innerText = mode === 'login' ? 'Iniciar Sesión' : 'Registrarse';
    }

    async function handleSubmit(e) {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const endpoint = mode === 'login' ? '/login' : '/register';

        try {
            let bodyData;
            let headers = {};
            if (mode === 'login') {
                bodyData = new URLSearchParams({ username: email, password: password });
                headers['Content-Type'] = 'application/x-www-form-urlencoded';
            } else {
                bodyData = JSON.stringify({ email, password });
                headers['Content-Type'] = 'application/json';
            }

            const res = await fetch(BACKEND_URL + endpoint, {
                method: 'POST',
                headers: headers,
                body: bodyData
            });

            const data = await res.json();
            if (res.ok) {
                const token = data.access_token;
                if (redirectUri) {
                    // Redirige el token al servidor local de Python en el puerto 18282
                    window.location.href = `${redirectUri}?token=${encodeURIComponent(token)}&email=${encodeURIComponent(email)}`;
                } else {
                    alert("¡Autenticación exitosa!");
                }
            } else {
                alert("Error: " + (data.detail || "No se pudo procesar la solicitud"));
            }
        } catch (err) {
            alert("Error al conectar con el servidor backend.");
        }
    }

    function loginWithGoogle() {
        let googleUrl = BACKEND_URL + "/auth/google";
        if (redirectUri) {
            googleUrl += "?redirect_uri=" + encodeURIComponent(redirectUri);
        }
        window.location.href = googleUrl;
    }
</script>

</body>
</html>
